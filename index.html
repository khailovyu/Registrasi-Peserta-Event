<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUCKYDRAW SPEKTAKULER - Registrasi Peserta</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- EmailJS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #4A0404 0%, #7A0C0C 50%, #2B0000 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .card-shadow {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- CONTAINER FORM PESERTA -->
    <div class="w-full max-w-md bg-white rounded-2xl overflow-hidden card-shadow border border-red-900/30 my-6">
        
        <!-- HEADER FORM -->
        <div class="bg-gradient-to-r from-red-950 via-red-900 to-red-950 p-6 text-center border-b-2 border-yellow-600">
            <div class="inline-block p-3 rounded-full bg-red-900/50 border border-yellow-500/40 mb-2">
                <i class="fa-solid fa-ticket text-3xl text-yellow-400"></i>
            </div>
            <h1 class="text-2xl font-black text-white tracking-wider uppercase">LUCKYDRAW SPEKTAKULER</h1>
            <p class="text-xs text-red-200 mt-1 uppercase tracking-widest">Registrasi Peserta Resmi</p>
        </div>

        <!-- FORM REGISTRASI -->
        <form id="registrationForm" class="p-6 space-y-4">
            
            <div id="errorAlert" class="hidden p-3 bg-red-100 border-l-4 border-red-600 text-red-700 text-xs rounded"></div>

            <!-- NAMA LENGKAP -->
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Nama Lengkap <span class="text-red-600">*</span></label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-user text-sm"></i>
                    </span>
                    <input type="text" id="fullName" required placeholder="Masukkan nama lengkap Anda"
                        class="w-full pl-9 pr-3 py-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-red-700 focus:bg-white outline-none transition">
                </div>
            </div>

            <!-- JABATAN -->
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Jabatan <span class="text-red-600">*</span></label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-briefcase text-sm"></i>
                    </span>
                    <select id="position" required
                        class="w-full pl-9 pr-3 py-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-red-700 focus:bg-white outline-none transition">
                        <option value="" disabled selected>-- Pilih Jabatan --</option>
                        <option value="Head">Head</option>
                        <option value="SPV">SPV</option>
                        <option value="Captain">Captain</option>
                        <option value="Senior Staff">Senior Staff</option>
                        <option value="Junior Staff">Junior Staff</option>
                        <option value="Freelance">Freelance</option>
                    </select>
                </div>
            </div>

            <!-- EMAIL -->
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Email Aktif <span class="text-red-600">*</span></label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-envelope text-sm"></i>
                    </span>
                    <input type="email" id="email" required placeholder="contoh: peserta@gmail.com"
                        class="w-full pl-9 pr-3 py-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-red-700 focus:bg-white outline-none transition">
                </div>
                <p class="text-[10px] text-gray-500 mt-1">*Kode unik akan dikirimkan otomatis ke inbox email ini.</p>
            </div>

            <!-- TOMBOL SUBMIT -->
            <button type="submit" id="btnSubmit"
                class="w-full py-3 bg-gradient-to-r from-red-800 to-red-900 hover:from-red-900 hover:to-red-950 text-white font-bold rounded-lg shadow-md hover:shadow-lg transition flex items-center justify-center gap-2 mt-2">
                <span>Daftar & Dapatkan Kode Unik</span>
                <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
        </form>

        <!-- FOOTER -->
        <div class="bg-gray-50 p-4 border-t border-gray-100 text-center text-xs text-gray-500">
            &copy; Panitia LUCKYDRAW SPEKTAKULER
        </div>
    </div>

    <!-- MODAL POPUP SUKSES -->
    <div id="successModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center card-shadow relative">
            <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl border-2 border-green-500">
                <i class="fa-solid fa-check"></i>
            </div>
            <h3 class="text-xl font-black text-gray-800 mb-1">Pendaftaran Berhasil!</h3>
            <p class="text-xs text-gray-600 mb-4">Simpan Kode Unik Anda di bawah ini:</p>

            <!-- KODE UNIK BOX -->
            <div class="bg-red-950 p-4 rounded-xl border border-yellow-500/50 mb-4">
                <p class="text-[10px] text-yellow-300 font-bold uppercase tracking-widest mb-1">KODE TIKET UNDIAN</p>
                <div id="modalCode" class="text-4xl font-black text-yellow-400 tracking-wider">----</div>
            </div>

            <div class="bg-gray-50 rounded-lg p-3 text-xs text-gray-600 mb-4 border border-gray-200">
                <p class="font-bold text-gray-800 mb-1" id="modalName">Nama Peserta</p>
                <p id="modalEmail" class="text-gray-500 truncate">email@peserta.com</p>
                <div class="mt-2 pt-2 border-t border-gray-200 text-[11px] text-green-700 font-medium flex items-center justify-center gap-1">
                    <i class="fa-solid fa-envelope-circle-check"></i>
                    <span>Tiket telah dikirim ke Inbox Email Anda!</span>
                </div>
            </div>

            <button onclick="closeModal()" class="w-full py-2.5 bg-gray-900 hover:bg-black text-white font-bold rounded-lg text-sm">
                Tutup & Selesai
            </button>
        </div>
    </div>

    <script>
        // =========================================================
        // KREDENSIAL EMAILJS PANITIA (SDAH TERPASANG)
        // =========================================================
        const EMAILJS_CONFIG = {
            serviceId: "service_36mkkrg",  
            templateId: "template_5jft6sk",
            publicKey: "DJ7WBGr-hRhnIKN6K" 
        };

        // Inisialisasi EmailJS
        (function() {
            if (EMAILJS_CONFIG.publicKey && EMAILJS_CONFIG.publicKey !== "YOUR_PUBLIC_KEY") {
                emailjs.init(EMAILJS_CONFIG.publicKey);
            }
        })();

        // ATURAN KODE AWALAN RAHASIA 4-DIGIT PER JABATAN
        const PREFIX_MAPPING = {
            "Head": "9",
            "SPV": "8",
            "Captain": "7",
            "Senior Staff": "6",
            "Junior Staff": "5",
            "Freelance": "4"
        };

        function generateUniqueCode(position) {
            const prefix = PREFIX_MAPPING[position] || "4";
            const random3Digits = Math.floor(100 + Math.random() * 900);
            return prefix + random3Digits; // Total 4 Digit
        }

        // PROSES SUBMIT FORM
        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btnSubmit = document.getElementById('btnSubmit');
            const errorAlert = document.getElementById('errorAlert');
            errorAlert.classList.add('hidden');
            
            const name = document.getElementById('fullName').value.trim();
            const position = document.getElementById('position').value;
            const email = document.getElementById('email').value.trim();

            if (!name || !position || !email) {
                errorAlert.innerText = "Mohon isi semua kolom pendaftaran!";
                errorAlert.classList.remove('hidden');
                return;
            }

            // Generate Kode 4-Digit
            const uniqueCode = generateUniqueCode(position);

            // Ubah Status Tombol Loading
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Mengirim Tiket...</span>`;

            // Data Variabel yang dikirim ke EmailJS Template
            const emailParams = {
                to_name: name,
                position: position,
                unique_code: uniqueCode,
                to_email: email
            };

            try {
                // Kirim Email di Background
                await emailjs.send(
                    EMAILJS_CONFIG.serviceId,
                    EMAILJS_CONFIG.templateId,
                    emailParams
                );

                // Tampilkan Popup Sukses
                document.getElementById('modalCode').innerText = uniqueCode;
                document.getElementById('modalName').innerText = name;
                document.getElementById('modalEmail').innerText = email;
                document.getElementById('successModal').classList.remove('hidden');

                document.getElementById('registrationForm').reset();

            } catch (err) {
                console.error("Gagal Kirim EmailJS:", err);
                // Tetap tampilkan kode unik di layar peserta jika ada gangguan koneksi/emailjs
                document.getElementById('modalCode').innerText = uniqueCode;
                document.getElementById('modalName').innerText = name;
                document.getElementById('modalEmail').innerText = email;
                document.getElementById('successModal').classList.remove('hidden');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<span>Daftar & Dapatkan Kode Unik</span> <i class="fa-solid fa-paper-plane text-xs"></i>`;
            }
        });

        function closeModal() {
            document.getElementById('successModal').classList.add('hidden');
        }
    </script>
</body>
</html>
